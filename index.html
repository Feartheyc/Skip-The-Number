<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Math Rhythm Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/sguest/roman-js/lib/roman.js"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <button id="pauseBtn" onclick="pauseGame()">⏸</button>
  
  <div id="pauseOverlay">
    <div class="pauseBox">
      <h2>Game Paused</h2>
      <button onclick="resumeGame()">Resume</button>
      <button onclick="goToMainMenu()">Main Menu</button>
    </div>
  </div>

  <div id="container">
    <video id="input_video" autoplay playsinline></video>
    <canvas id="game_canvas"></canvas>

    <div id="menu">
      <h1>Math Adventure</h1>
      <div class="game-grid">
        <button class="tile-1" onclick="startGame('game1')"><span>⏭️</span>Skip Num</button>
        <button class="tile-2" onclick="startGame('game2')"><span>🎲</span>Even-Odd 1</button>
        <button class="tile-3" onclick="startGame('Game3')"><span>↔️</span>Compare</button>
        <button class="tile-4" onclick="startGame('Game4')"><span>🎲</span>Even-Odd 2</button>
        <button class="tile-5" onclick="startGame('Game5')"><span>🏛️</span>Roman 1</button>
        <button class="tile-6" onclick="startGame('Game6')"><span>🔡</span>Ordinals</button>
        <button class="tile-7" onclick="startGame('Game7')"><span>🏛️</span>Roman 2</button>
        <button class="tile-8" onclick="startGame('Game9')"><span>🔡</span>ord-1</button>
        <button class="tile-9" onclick="startGame('Game10')"><span>🔡</span>ord-2</button>
        <button class="tile-10" onclick="startGame('Game8')"><span>🎲</span>Even-Odd 3</button>
        <button class="tile-11" onclick="startGame('Game11')"><span>🔡</span>Ordinals Beta</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="main.js"></script>
  <script src="skip-number.js"></script>
  <script src="even-odd-1.js"></script>
  <script src="even-odd-2.js"></script>
  <script src="hand-detection.js"></script>
  <script src="comparators.js"></script>
  <script src="roman.js"></script>
  <script src="ordinal.js"></script>
  <script src="romanexperiment.js"></script>
  <script src="ordinal-beta.js"></script>
  <script src="ordinal2.js"></script>
  <script src="even-odd-3.js"></script>
  <script src="ordinals-beta-2.js"></script>
</body>
</html>
